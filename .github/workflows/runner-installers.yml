name: Runner installer checks
on:
  push:
    paths: ['packaging/runner/**', 'scripts/test-runner-setup.py', '.github/workflows/runner-installers.yml']
  pull_request:
    paths: ['packaging/runner/**', 'scripts/test-runner-setup.py', '.github/workflows/runner-installers.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-runner-setup.py
