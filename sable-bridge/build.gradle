plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '1.0.0'
group = 'local.servermanager'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge { version = '21.1.249' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += ['-proc:none'] }
jar { archiveFileName = 'servermanager-sable-bridge.jar' }
sourceSets {
    probe {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
tasks.register('probeJar', Jar) {
    from sourceSets.probe.output
    archiveFileName = 'isolated-sable-probe.jar'
}
tasks.withType(Jar).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
jar { from('LICENSE') }
